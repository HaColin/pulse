<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pulse</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f4ef;
    --panel: #fffefb;
    --ink: #1d1c19;
    --soft: #6d6b63;
    --line: #e3e0d6;
    --chip: #efede5;
    --active: #1f9d5b;
    --idle: #b9831a;
    --offline: #a9a69c;
    --you: #2b5fd9;
    --warn-bg: #fdf1d3;
    --warn-ink: #6f4700;
    --warn-line: #ecd08a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131311;
      --panel: #1b1b18;
      --ink: #eceae3;
      --soft: #99968c;
      --line: #2b2a26;
      --chip: #262521;
      --active: #46c783;
      --idle: #dcab45;
      --offline: #5f5d56;
      --you: #8fb0ff;
      --warn-bg: #2e2510;
      --warn-ink: #f0d083;
      --warn-line: #57451a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 16px 64px; }

  header { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 22px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
  h1 span { color: var(--soft); font-weight: 500; }
  .tally { color: var(--soft); }
  .link { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--soft); font-size: 13px; }
  .link i { width: 8px; height: 8px; border-radius: 50%; background: var(--active); }
  .link.down i { background: var(--idle); }

  .alerts { display: grid; gap: 8px; margin-bottom: 20px; }
  .alert {
    padding: 10px 14px;
    border: 1px solid var(--warn-line);
    border-radius: 10px;
    background: var(--warn-bg);
    color: var(--warn-ink);
    overflow-wrap: anywhere;
  }
  .alert code { font-weight: 600; }

  .people { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); align-items: start; }
  .card { padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  .card.offline { opacity: 0.62; }

  .who { display: flex; align-items: center; gap: 11px; }
  .avatar {
    flex: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: hsl(var(--hue) 42% 46%);
    color: #fff;
    font-size: 13px;
    font-weight: 650;
    letter-spacing: 0.02em;
  }
  .id { min-width: 0; flex: 1; }
  .name { font-weight: 650; overflow-wrap: anywhere; }
  .name em { margin-left: 6px; color: var(--you); font-size: 12px; font-style: normal; font-weight: 600; }
  .sub { color: var(--soft); font-size: 13px; overflow-wrap: anywhere; }
  .pill { flex: none; display: flex; align-items: center; gap: 6px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--offline); }
  .pill.active i { background: var(--active); }
  .pill.idle i { background: var(--idle); }

  .doing { margin: 16px 0 12px; font-size: 18px; font-weight: 620; line-height: 1.3; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .files { display: flex; flex-wrap: wrap; gap: 6px; }
  code, .chip { font: 12.5px/1.4 ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace; }
  .chip { padding: 2px 8px; border-radius: 6px; background: var(--chip); overflow-wrap: anywhere; }
  .chip b { font-weight: 400; color: var(--soft); }
  .chip.clash { background: var(--warn-bg); color: var(--warn-ink); box-shadow: inset 0 0 0 1px var(--warn-line); }
  .chip.clash b { color: inherit; opacity: 0.75; }
  .chip.more { background: none; color: var(--soft); padding-left: 2px; }
  .facts { margin-top: 10px; color: var(--soft); font-size: 13px; font-variant-numeric: tabular-nums; }

  .earlier { margin: 14px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line); list-style: none; display: grid; gap: 5px; font-size: 13.5px; color: var(--soft); }
  .earlier li { display: grid; grid-template-columns: 44px 1fr; gap: 8px; overflow-wrap: anywhere; }
  .earlier time { font-variant-numeric: tabular-nums; opacity: 0.8; }

  .empty { padding: 56px 20px; border: 1px dashed var(--line); border-radius: 14px; text-align: center; color: var(--soft); }
  .empty h2 { margin: 0 0 6px; color: var(--ink); font-size: 17px; }
  .empty p { margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>pulse <span id="repo"></span></h1>
    <span class="tally" id="tally"></span>
    <span class="link" id="link"><i></i><span id="link-text">connecting</span></span>
  </header>
  <section class="alerts" id="alerts" aria-label="Possible merge conflicts"></section>
  <main class="people" id="people"></main>
</div>
<script>
  // Names, headlines and file paths come from teammates' machines, so everything is set as text, never as HTML.
  const el = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  };
  const byId = (id) => document.getElementById(id);

  let state = null;
  let drawn = '';

  function ago(ts) {
    const seconds = Math.max(0, Math.floor(Date.now() / 1000) - ts);
    if (seconds < 60) return 'just now';
    if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
    if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
    return `${Math.floor(seconds / 86400)}d ago`;
  }
  const clock = (ts) => new Date(ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
  const hue = (slug) => [...slug].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) % 360, 7);
  function initials(name) {
    const parts = name.trim().split(/[\s._-]+/).filter(Boolean);
    return ((parts[0]?.[0] ?? '?') + (parts[1]?.[0] ?? parts[0]?.[1] ?? '')).toUpperCase();
  }
  const nameOf = (slug) => (slug === state.me ? 'You' : state.people.find((p) => p.slug === slug)?.name ?? slug);
  function join(names) {
    names.sort((a, b) => (a === 'You' ? -1 : b === 'You' ? 1 : 0));
    return names.length > 2 ? `${names.slice(0, -1).join(', ')} and ${names.at(-1)}` : names.join(' and ');
  }

  function fileChip(file, clash) {
    const chip = el('span', clash ? 'chip clash' : 'chip');
    const cut = file.lastIndexOf('/') + 1;
    if (cut) chip.append(el('b', null, file.slice(0, cut)));
    chip.append(file.slice(cut));
    if (clash) chip.title = 'Someone else also has unmerged changes here';
    return chip;
  }

  function card(person, clashes) {
    const node = el('article', `card ${person.status}`);

    const who = el('div', 'who');
    const avatar = el('span', 'avatar', initials(person.name));
    avatar.style.setProperty('--hue', hue(person.slug));
    const id = el('div', 'id');
    const name = el('div', 'name', person.name);
    if (person.me) name.append(el('em', null, 'you'));
    const sub = el('div', 'sub');
    if (person.branch) sub.append(`${person.branch} · `);
    const seen = el('span', null, ago(person.ts));
    seen.dataset.ts = person.ts;
    sub.append(seen);
    id.append(name, sub);
    const pill = el('span', `pill ${person.status}`);
    pill.append(el('i'), { active: 'Active', idle: 'Idle', offline: 'Offline' }[person.status]);
    who.append(avatar, id, pill);

    node.append(who, el('p', 'doing', person.headline));

    if (person.files.length) {
      const files = el('div', 'files');
      for (const file of person.files.slice(0, 6)) files.append(fileChip(file, clashes.has(file)));
      if (person.files.length > 6) files.append(el('span', 'chip more', `+${person.files.length - 6} more`));
      node.append(files);
    }

    const facts = [];
    if (person.stats?.files) facts.push(`+${person.stats.add} −${person.stats.del} this snapshot`);
    if (person.inflight.length) facts.push(`${person.inflight.length} file${person.inflight.length === 1 ? '' : 's'} not merged yet`);
    if (facts.length) node.append(el('div', 'facts', facts.join(' · ')));

    const earlier = person.history.slice(1, 6);
    if (earlier.length) {
      const list = el('ol', 'earlier');
      for (const item of earlier) {
        const row = el('li');
        row.append(el('time', null, clock(item.since)), el('span', null, item.headline));
        list.append(row);
      }
      node.append(list);
    }
    return node;
  }

  function render() {
    byId('repo').textContent = state.repo;
    const active = state.people.filter((p) => p.status === 'active').length;
    byId('tally').textContent = state.people.length
      ? `${state.people.length} ${state.people.length === 1 ? 'person' : 'people'} · ${active} active`
      : '';

    const signature = JSON.stringify([state.people.map((p) => [p.sha, p.status]), state.overlaps]);
    if (signature === drawn) return;
    drawn = signature;

    const alerts = byId('alerts');
    alerts.replaceChildren();
    for (const overlap of state.overlaps.slice(0, 8)) {
      const alert = el('div', 'alert');
      alert.append(`${join(overlap.people.map(nameOf))} ${overlap.people.length > 2 ? 'all' : 'both'} have unmerged changes in `, el('code', null, overlap.file));
      alerts.append(alert);
    }
    if (state.overlaps.length > 8) alerts.append(el('div', 'alert', `…and ${state.overlaps.length - 8} more files with overlapping changes`));

    const people = byId('people');
    people.replaceChildren();
    if (!state.people.length) {
      const empty = el('div', 'empty');
      const hint = el('p');
      hint.append('Run ', el('code', null, 'pulse start'), ' in your clone of this repo. Teammates show up here once they do the same.');
      empty.append(el('h2', null, 'No snapshots yet'), hint);
      empty.style.gridColumn = '1 / -1';
      people.append(empty);
      return;
    }
    for (const person of state.people) {
      const clashes = new Set(state.overlaps.filter((o) => o.people.includes(person.slug)).map((o) => o.file));
      people.append(card(person, clashes));
    }
  }

  function setLink(up) {
    byId('link').classList.toggle('down', !up);
    byId('link-text').textContent = up ? 'live' : 'pulse is not running';
  }

  async function load() {
    try {
      const response = await fetch('/api/state', { cache: 'no-store' });
      if (!response.ok) throw new Error(response.statusText);
      state = await response.json();
      setLink(true);
      render();
    } catch {
      setLink(false);
    }
  }

  setInterval(load, 4000);
  setInterval(() => {
    for (const node of document.querySelectorAll('[data-ts]')) node.textContent = ago(Number(node.dataset.ts));
  }, 15000);
  load();
</script>
</body>
</html>
